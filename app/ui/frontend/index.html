<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <meta name="referrer" content="no-referrer" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; font-src 'self'; media-src blob:; connect-src 'self' http://127.0.0.1:* http://localhost:* http://[::1]:*; object-src 'none'; base-uri 'self'"
    />
    <title>Banking Intelligence</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#content">Skip to workspace</a>
    <div id="app"></div>
    <div id="toast" role="status" aria-live="polite"></div>
    <dialog id="dialog" aria-labelledby="dialog-title"></dialog>
    <input id="video-input" type="file" accept=".mov,.mp4" hidden />
    <input
      id="report-input"
      type="file"
      accept=".json,application/json"
      hidden
    />
    <input
      id="frames-input"
      type="file"
      accept="image/jpeg,image/png"
      multiple
      hidden
    />
    <script type="module" src="app.js"></script>
  </body>
</html>
