[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "fortebank-cash-discipline-vision"
version = "0.1.0"
description = "Local, PTS-aware visual observations for Datathon 26"
requires-python = ">=3.11"
dependencies = [
  "av>=16,<19",
  "numpy>=2,<3",
  "opencv-python-headless>=4.11,<5",
  "pydantic>=2.10,<3",
  "ollama>=0.5,<1",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]
backend = [
  "fastapi>=0.110.0",
  "uvicorn[standard]>=0.28.0",
  "aiosqlite>=0.20.0",
  "python-multipart>=0.0.9",
]
yolo = ["ultralytics>=8.3,<9"]

[tool.setuptools.packages.find]
include = ["app*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires explicitly supplied local files and Ollama"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
